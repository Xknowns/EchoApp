name: echo_mobile
description: ECHO - Automatic life context capture and recall

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  dio: ^5.4.0

  # WebSocket
  web_socket_channel: ^2.4.0

  # State management
  flutter_bloc: ^8.1.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # SQLite for offline cache
  sqflite: ^2.3.0

  # Audio recording (voice memos)
  record: ^5.0.4

  # Image picker (photo capture)
  image_picker: ^1.0.7

  # Notifications
  flutter_local_notifications: ^16.3.2

  # Background tasks
  workmanager: ^0.5.2

  # Calendar integration
  device_calendar: ^4.3.2

  # Share sheet
  share_plus: ^7.2.1

  # URL launcher
  url_launcher: ^6.2.4

  # Date formatting
  intl: ^0.19.0

  # Pull to refresh
  pull_to_refresh: ^2.0.0

  # Shimmer loading effect
  shimmer: ^3.0.0

  # Cupertino icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

  # Mocking
  mockito: ^5.4.4
  build_runner: ^2.4.8

  # Hive generator
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700