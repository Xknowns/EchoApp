name: ECHO CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '21']

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Start infrastructure
      run: docker compose -f docker-compose-echo.yml up -d postgres redis ollama minio

    - name: Wait for PostgreSQL
      run: |
        for i in {1..30}; do
          docker exec echo-postgres pg_isready -U echo && break
          sleep 1
        done

    - name: Build with Maven
      run: mvn clean verify --batch-mode

    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests (JDK ${{ matrix.java-version }})
        path: '**/target/surefire-reports/*.xml'
        reporter: java-junit

    - name: Stop infrastructure
      if: always()
      run: docker compose -f docker-compose-echo.yml down

  checkstyle:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    - name: Run Checkstyle
      run: mvn checkstyle:check --batch-mode

  flutter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
    - name: Get dependencies
      working-directory: echo-mobile
      run: flutter pub get
    - name: Analyze
      working-directory: echo-mobile
      run: flutter analyze
    - name: Test
      working-directory: echo-mobile
      run: flutter test